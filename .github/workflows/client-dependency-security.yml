name: Client dependency security

on:
  pull_request:
    paths:
      - "client/package.json"
      - "client/package-lock.json"
      - ".github/workflows/client-dependency-security.yml"

permissions:
  contents: read

concurrency:
  group: client-dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-build-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Resolve lockfile from declared manifest
        working-directory: client
        run: |
          npm install --package-lock-only
          echo "HARVEST_BUILD_LOCK_BEGIN"
          cat package-lock.json
          echo "HARVEST_BUILD_LOCK_END"

      - name: Verify resolved audit state
        working-directory: client
        run: npm audit --audit-level=moderate
