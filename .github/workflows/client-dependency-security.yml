name: Repository dependency security

# Receipt gate: committed lockfiles are verified, never repaired in CI.

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "server/package.json"
      - "server/package-lock.json"
      - "client/package.json"
      - "client/package-lock.json"
      - "client/vite.config.js"
      - ".github/workflows/client-dependency-security.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-repository:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Verify root dependencies
        run: |
          npm ci
          npm audit --audit-level=moderate

      - name: Verify server dependencies
        working-directory: server
        run: |
          npm ci
          npm audit --audit-level=moderate
          node -e "const AT=require('africastalking'); const client=AT({apiKey:'sandbox-key-placeholder',username:'sandbox'}); if (!client.SMS) throw new Error('Africa\'s Talking SMS client unavailable'); console.log('Africa\'s Talking SDK smoke: OK')"

      - name: Verify client dependencies and build
        working-directory: client
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm run build
